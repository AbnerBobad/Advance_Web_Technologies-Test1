<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImageLab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>ImageLab</h1>
    <p class="tagline">Upload an image. ImageLab accepts the work and processes it in the background.</p>

    <section class="card upload-card" aria-label="Image selection">
      <input
        type="file"
        id="fileInput"
        accept="image/jpeg,image/png"
        hidden
      >
      <button type="button" id="chooseButton" class="button button-secondary">
        Choose image
      </button>

      <div id="previewArea" class="preview-area hidden" aria-live="polite">
        <img id="previewImage" alt="Selected image preview">
        <dl class="file-info">
          <div><dt>File</dt><dd id="fileName">-</dd></div>
          <div><dt>Size</dt><dd id="fileSize">-</dd></div>
          <div><dt>Type</dt><dd id="fileType">-</dd></div>
        </dl>
      </div>

      <p id="selectionMessage" class="message hidden" role="status"></p>

      <div class="actions">
        <button type="button" id="processButton" class="button button-primary" disabled>
          Process image
        </button>
      </div>
    </section>

    <p id="statusMessage" class="message message-info hidden" role="status"></p>
    <p id="errorMessage" class="message message-error hidden" role="alert"></p>

    <section class="card job-card" aria-label="Job">
      <h2>Job</h2>
      <div id="jobCardBody" class="job-body">
        <p class="muted">No active job.</p>
      </div>
    </section>

    <section class="card results-card" aria-label="Results">
      <h2>Results</h2>
      <p class="muted">No images generated yet.</p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
